{% extends 'base.html' %}
{% block title %}Password Reset Complete — PrioritySuite{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border">
            <div class="card-body p-4 text-center">
                <div class="fs-1 mb-2 text-success">✓</div>
                <h4 class="card-title text-terracotta mb-2">Password Reset Complete</h4>
                <p class="text-muted small">
                    Your password has been changed successfully. You can now sign in with your new credentials.
                </p>
                <div class="mt-4">
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary bg-terracotta btn-sm">Sign In Now</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
